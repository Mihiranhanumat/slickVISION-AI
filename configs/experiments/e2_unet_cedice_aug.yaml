# E2 - Main proposed system: U-Net/ResNet34 + weighted CE + Dice + SAR-safe augmentation.
inherits: configs/unet_resnet34.yaml
experiment: {id: E2, name: e2_unet_cedice_aug}
model: {classes: 2}
training:
  epochs: 30
  early_stopping_patience: 8
  loss: {name: combined_ce_dice, ce_weight: 0.5, dice_weight: 0.5, use_class_weights: true}
augmentation: {enabled: true}
